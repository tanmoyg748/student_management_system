<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
</head>

<body>

    <h1>Student Management System</h1>

    <a href="{% url 'add_student' %}">
        Add New Student
    </a>

    <br><br>

    <table border="1" cellpadding="10">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}

        <tr>

            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.phone }}</td>
            <td>{{ student.course }}</td>

            <td>

                <a href="{% url 'edit_student' student.id %}">
                    Edit
                </a>

                |

                <a href="{% url 'delete_student' student.id %}">
                    Delete
                </a>

            </td>

        </tr>

        {% empty %}

        <tr>
            <td colspan="6">
                No students found.
            </td>
        </tr>

        {% endfor %}

    </table>

</body>
</html>
